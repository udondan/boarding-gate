---
name: Test

on:
  pull_request:
    branches:
      - main
  # Coverage of main is what Codecov compares pull requests against.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: shellcheck

      - name: Lint wait.sh and tests
        run: shellcheck -x wait.sh test/bin/gh test/lib/*.bash test/helpers.bash test/wait.bats test/coverage.sh test/e2e/*.sh test/e2e/scenarios/*.sh test/e2e/template/scripts/*.sh

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: bats ruby

      - name: Install bashcov
        run: bundle install

      # Runs wait.sh against a fake GitHub API (see test/bin/gh) and measures
      # its coverage (see test/coverage.sh).
      - name: Test wait.sh
        run: bundle exec bashcov -- test/coverage.sh

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/coverage.xml
          disable_search: true
          # Pull requests from forks get no OIDC token and upload without one.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          fail_ci_if_error: false

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: |
          actionlint
          actionlint test/e2e/template/.github/workflows/*.yml

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # Calls the reusable workflow of this commit as other repositories do, so a
  # broken change of it or of the action fails here before it is released.
  # Runs of pull requests from forks get a read-only token and wait for
  # priority-boarding-forks.yml to take the turn on their behalf.
  priority-boarding:
    permissions:
      actions: read
      contents: write # lock refs under refs/priority-boarding/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    uses: $/.github/workflows/priority-boarding.yml
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [shellcheck, test, actions, priority-boarding]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
